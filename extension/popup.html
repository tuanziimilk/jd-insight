<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>JD 采集器 · AI 产品岗</title>
<link rel="stylesheet" href="theme.css">
<style>
  /* 配色 token 全在 theme.css（Vercel/Geist，近乎无彩）。
     这里只管 popup 自己的布局和字号。 */
  body {
    width: 330px;
    margin: 0;
    padding: 14px;
    background: var(--paper);
    color: var(--ink);
    font: 13px/1.6 var(--sans);
  }
  h1 { margin: 0 0 3px; font-size: 14.5px; font-weight: 600; letter-spacing: -.02em; }
  /* .sub 删了：这一页没有任何元素在用它（副标题早就搬走了）。死 CSS 会让
     下次改的人以为这里有个副标题层。popup 其余小字都是短标签，11.5px 合规。 */

  /* 计数。C 案的做法：沉底方框 + 大号等宽数字 + 等宽小标。
     数字是这一屏唯一的"大字"，所以它不需要颜色也能当锚点。 */
  /* 计数。刻意不做成方框：顶部本来已经有「主按钮 / 同步按钮 / 三个导出」
     三条横向色块，再加一个带填色和边框的方框，一屏最上面就是四层堆叠，
     压迫感全在这儿。数字 30px 本身就够当锚点，不需要框住它。 */
  .count {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 4px 0 12px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 12px;
  }
  .count b {
    font: 600 30px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }
  .count span { font: 11.5px/1 var(--sans); color: var(--muted); }

  /* ── 按钮分三层，按"多久用一次"排，不按"是不是导出"排 ──
     一层：打开情报台，整行实黑，这一屏唯一的主动作。
     二层：三个导出并排，小一号、线框、安静。它们是偶尔用的。
     三层：清空 —— 从按钮组里拿出去，放到最底下、只有文字。
     ⚠️ 最后这条是有来由的：清空不可逆，而它原来和「导出 JSON」
     并排、同样大小。这跟列表行里「删除」不能长得像「切换意向」
     是同一个道理，那处已经修过一次。 */
  /* 间距统一到 4px 刻度上。原来是 7/8/9/11/-3 混着来，
     竖向节奏看着"差一点"却说不出哪里差。 */
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .row button { flex: 1; }
  .row.mini { gap: 8px; margin-bottom: 12px; }
  .row.mini button {
    padding: 7px 5px;
    font-size: 11.5px;
    color: var(--ink2);
    border-color: var(--rule);
  }
  .row.mini button:hover:not(:disabled) { color: var(--ink); border-color: var(--acc); }

  /* 同步状态行。紧贴按钮下方、等宽小字。
     它要能表达四种状态：未配置 / 未登录 / 已是最新 / 有 N 条没推。
     配色是无彩的，所以「需要注意」只能靠 --warn 这一点颜色，
     不能再靠加粗或图标堆——那会变成噪声。 */
  .syncline {
    margin: 0 0 12px;
    font: 12px/1.55 var(--sans);
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 16px;
  }
  .syncline.need { color: var(--warn); }
  .syncline.bad { color: var(--stop); }
  .syncline a { font: inherit; color: inherit; }

  .list {
    /* 240 ≈ 三行整。原来 200px 正好把第三行切在字中间，看着像渲染坏了。
       底部那段路径说明收进 details 之后腾出的高度，正好补给这里。 */
    max-height: 240px;
    overflow-y: auto;
    border: 1px solid var(--rule);
    border-radius: var(--r);
    background: var(--card);
  }
  .item { padding: 12px; font-size: 12px; }
  .item + .item { border-top: 1px solid var(--rule); }
  /* 两行省略。原来在 JS 里 slice(0, 26) 硬截，没有省略号——
     那是在悄悄丢字，看的人不知道后面还有。CSS 截断会给出真正的「…」。 */
  .item .t {
    font-weight: 600;
    color: var(--ink);
    font-size: 12.5px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .item .m { color: var(--ink2); font: 12px/1.5 var(--sans); }
  .item .warn { color: var(--warn); }
  .tags { display: flex; gap: 6px; margin-top: 8px; align-items: center; }

  /* ── chip 三类，权重刻意分开 ──────────────────────────────
     这一行里有三种东西，之前它们长得一样或者反了：
       1. 值（薪资、挂因）—— 要被**读**，不该有填色
       2. 开关（意向、状态）—— 要被**点**，选中时需要一个明确的"开着"
       3. 不可逆操作（删除）—— 平时不该抢注意力，动手时才需要警告
     之前 1 和 2 共用 .on（黑底白字），于是纯数据看起来像开着的开关，
     而黑底本该是整屏唯一主动作的专属。 */
  .chip {
    flex: 0 0 auto; padding: 4px 8px; font: 500 11.5px/1 var(--sans);
    border: 1px solid var(--rule); border-radius: var(--r-sm);
    background: var(--card); color: var(--ink2); cursor: pointer;
  }
  .chip:hover { border-color: var(--acc); color: var(--ink); }

  /* 2. 开关的选中态。用淡底 + 实边 + 深字，不用黑底：
     黑底留给「打开情报台」那一个主动作，一屏出现四五块就没有主次了。 */
  .chip.on {
    background: var(--acc-soft);
    border-color: var(--rule-strong);
    color: var(--ink);
  }

  /* 1. 值。等宽 + 表格数字，无填色无边框——它靠字形和字重立住，
     这正是 C 案的做法：等宽字本身就是"这是数据"的标记。
     悬停才浮出边框，提示它可以点开改。 */
  .chip.sal {
    /* 上一版去掉填色之后又太不显眼了。改成用**字色**做强调：
       13px / 700 / 等宽 + 深绿。绿在这里不是"好"的意思，是"这条有金额了"
       —— 它是列表里唯一的绿，所以扫一眼就能数出哪几条还缺。
       刻意不加填色和边框：填色那一版正是"太黑太吸睛"的来源。 */
    font: 700 13px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ok);
    background: transparent;
    border-color: transparent;
    padding-left: 2px;
  }
  .chip.sal:hover { border-color: var(--rule-strong); background: var(--card); }
  /* 待补是这一行唯一需要你动手的地方，所以它反而该有颜色和虚线边 */
  .chip.sal.pend {
    font: 500 11.5px/1 var(--sans);
    color: var(--warn);
    border: 1px dashed var(--warn);
    padding-left: 8px;
  }
  .chip.sal.pend:hover { background: var(--warn-soft); }

  /* 挂因也是标注不是开关 */
  .chip.note { background: var(--sunk); border-color: transparent; color: var(--ink2); }

  /* 3. 删除。默认中性，只在悬停时变红。
     ⚠️ 原来它常态就是红字红边——三行列表下来是一条红柱，比内容还吸睛，
     而一直红的红色等于没有红色。危险色留给"你正要动手"的那一刻。 */
  .chip.del {
    margin-left: auto;
    color: var(--muted);
    border-color: transparent;
  }
  .chip.del:hover { background: var(--stop); color: #fff; border-color: var(--stop); }
  .salinput {
    flex: 0 0 auto; width: 112px; padding: 3px 6px; font: 12px/1.5 var(--mono);
    border: 1px solid var(--acc); border-radius: var(--r-sm);
    background: var(--card); color: var(--ink);
  }
  .salinput:focus { outline: none; box-shadow: 0 0 0 3px var(--acc-soft); }
  /* 空状态承担首次使用的引导。⚠️ 上一轮把顶部那两行操作说明搬去设置页，
     却没同步加强这里——结果新用户打开弹窗只看到「还没有存任何 JD」，
     完全不知道该干什么。搬走常驻文案的前提是空状态得接住它。 */
  .empty {
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    color: var(--muted);
    font: 12px/1.7 var(--sans);
  }
  .empty b { color: var(--ink2); font-size: 12.5px; font-weight: 600; }

  /* 底部渐隐。列表行高不固定，容器高度永远不会正好切在行边界上——
     没有这道渐隐时，最后一行被切在字中间，看着像渲染坏了。
     渐隐把"切断"读成"下面还有"。 */
  .listwrap { position: relative; }
  .listwrap.scrollable::after {
    content: "";
    position: absolute;
    left: 1px;
    right: 1px;
    bottom: 1px;
    height: 22px;
    background: linear-gradient(to top, var(--card), transparent);
    border-radius: 0 0 var(--r) var(--r);
    pointer-events: none;
  }


  /* 底栏：左边是说明入口（导航），右边是清空（不可逆操作）。
     两端对齐、隔一整行宽度——不可逆的东西不该和别的动作挨着。 */
  .foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--rule);
  }
  /* ⚠️ 两者原来都是「muted + 下划线」，长得一模一样——一个是帮助、
     一个是清掉全部数据。下划线留给导航（使用说明），清空不带下划线，
     只在悬停时才变红并划线：它平时该是这一屏最安静的东西。 */
  .foot a { font: 12px/1.6 var(--sans); color: var(--muted); }
  .foot a:hover { color: var(--ink2); }
  /* 左侧两个导航入口共用一个容器，中间一个点分隔。
     ⚠️ 加「设置」是因为原来 popup 进设置页的唯一路径是「使用说明」——
     那个词读起来是帮助文档，不是设置。想换模型的人在 popup 里
     看不到任何入口，只能先打开情报台再点齿轮。链路绕了一圈。 */
  .nav { display: flex; align-items: center; gap: 8px; }
  /* 11px 低于 theme.css 记的 11.5px 下限，但这里放的是一个「·」——
     它是分隔符不是文字，不需要被读。留个注，免得下次扫字号时被当成违规。 */
  .nav .dot { color: var(--rule-strong); font-size: 11px; }
  #clear {
    padding: 4px 2px;
    font-size: 11.5px;
    background: none;
    border: 0;
    color: var(--muted);
    text-decoration: none;
  }
  #clear:hover:not(:disabled) {
    color: var(--stop);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
</style>
</head>
<body>
  <h1>JD 采集器</h1>

  <div class="count"><b id="n">0</b><span>条已存</span></div>

  <div class="row">
    <button id="panel" class="primary">打开情报台（问它）</button>
  </div>

  <!-- 同步原来只在设置页。可是「采集完 → 同步 → 工作台能看到」是主链路，
       而设置页是个一年去两次的地方。所以提到这里，并且带一行状态——
       一个不说"该不该点"的同步按钮，等于让人每次都盲点一遍。 -->
  <div class="row">
    <button id="sync">同步到云端</button>
  </div>
  <p class="syncline" id="syncline">检查同步状态…</p>
  <div class="row mini">
    <button id="export">导出 TXT</button>
    <button id="copy">复制全部</button>
    <button id="json">备份 JSON</button>
  </div>

  <!-- 列表外面套一层是为了那道底部渐隐：滚动容器自己的 ::after 会跟着
       内容滚走，钉不住。渐隐只在真的能滚时才加（JS 加 .scrollable），
       否则短列表底下会挂一块说不清的灰。 -->
  <div class="listwrap" id="listwrap">
    <div class="list" id="list"><div class="empty"><b>还没有存任何 JD</b><span>去 BOSS 直聘的岗位列表，鼠标在一张岗位卡上停一下，点页面上的「存 JD」或按 Alt+S。</span><span>更多细节看下面的「使用说明」。</span></div></div>
  </div>

  <!-- 说明全部搬到设置页。popup 每天开几十次，不该常驻两段只在头几次
       有用的文字（怎么存、导出后怎么跑脚本）。这里只留一个入口。 -->
  <div class="foot">
    <span class="nav">
      <a href="#" id="openSettings">设置</a>
      <span class="dot">·</span>
      <a href="#" id="help">使用说明</a>
    </span>
    <button id="clear">清空全部记录</button>
  </div>

  <!-- 守卫必须排在前面且是普通脚本：这样 popup.js（module）的加载/求值错误
       也能被它的 window.onerror 捕获，界面上会看到原因而不是"没数据" -->
  <script src="popup-guard.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
