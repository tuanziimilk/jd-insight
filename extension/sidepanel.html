<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>JD Insight · 求职情报台</title>
<style>
  :root {
    --paper: #eef1f4; --card: #fff; --sunk: #dde5ea;
    --ink: #131b23; --ink2: #3e4c58; --muted: #62717e; --rule: #c8d2da;
    --acc: #0d5c73; --acc-soft: #d3e6ec;
    --ok: #1c6b4f; --warn: #91600d; --warn-soft: #f6ecd6; --stop: #96282e;
    --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #0e1418; --card: #161e25; --sunk: #121a20;
      --ink: #e4eaee; --ink2: #b9c6cf; --muted: #8b9aa6; --rule: #2b353e;
      --acc: #6fbcd1; --acc-soft: #16323b;
      --ok: #58b491; --warn: #d7a349; --warn-soft: #322718; --stop: #e0807c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; flex-direction: column;
    background: var(--paper); color: var(--ink);
    font: 13.5px/1.65 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  header {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 9px 12px; border-bottom: 1px solid var(--rule); background: var(--card);
  }
  header h1 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .01em; }
  header .n {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    padding: 2px 7px; border: 1px solid var(--rule); border-radius: 100px;
  }
  header .sp { flex: 1; }
  .ico {
    border: 1px solid var(--rule); background: var(--card); color: var(--ink2);
    width: 26px; height: 26px; border-radius: 5px; cursor: pointer; font-size: 13px;
    display: grid; place-items: center; padding: 0;
  }
  .ico:hover { border-color: var(--acc); color: var(--acc); }

  #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }

  .msg { max-width: 100%; }
  .msg.u { align-self: flex-end; max-width: 88%; }
  .bubble {
    padding: 9px 12px; border-radius: 9px; white-space: pre-wrap; word-break: break-word;
  }
  .u .bubble { background: var(--acc); color: #fff; border-bottom-right-radius: 3px; }
  .a .bubble { background: var(--card); border: 1px solid var(--rule); border-bottom-left-radius: 3px; }
  .meta {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    margin-bottom: 4px; display: flex; gap: 7px; flex-wrap: wrap; align-items: center;
  }
  .tag {
    padding: 1px 6px; border-radius: 3px; background: var(--sunk); color: var(--ink2);
  }
  .tag.rule { background: var(--acc-soft); color: var(--acc); }
  .tag.model { background: var(--warn-soft); color: var(--warn); }

  .bubble table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 12.5px; }
  .bubble th, .bubble td { border: 1px solid var(--rule); padding: 4px 7px; text-align: left; }
  .bubble th { background: var(--sunk); }
  .bubble code { font-family: var(--mono); background: var(--sunk); padding: 1px 4px; border-radius: 3px; font-size: .9em; }
  .confirm {
    background: var(--warn-soft); color: var(--warn); border: 1px dashed var(--warn);
    padding: 1px 5px; border-radius: 3px; font-weight: 600;
  }
  .cite { font-family: var(--mono); color: var(--acc); font-weight: 600; }

  .sources { margin-top: 7px; padding-top: 6px; border-top: 1px dashed var(--rule); font-size: 11.5px; }
  .sources a { color: var(--acc); text-decoration: none; }
  .sources a:hover { text-decoration: underline; }
  .sources .s { color: var(--muted); font-family: var(--mono); }

  .sys {
    align-self: center; text-align: center; font-size: 11.5px; color: var(--muted);
    background: var(--sunk); border-radius: 100px; padding: 3px 12px;
  }

  /* 槽位追问卡片 */
  .slot {
    background: var(--card); border: 1px solid var(--warn); border-left-width: 3px;
    border-radius: 6px; padding: 11px;
  }
  .slot h4 { margin: 0 0 5px; font-size: 12.5px; color: var(--warn); }
  .slot p { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
  .slot textarea {
    width: 100%; min-height: 90px; resize: vertical; padding: 7px;
    border: 1px solid var(--rule); border-radius: 5px; background: var(--paper);
    color: var(--ink); font: 12px/1.5 inherit;
  }
  .slot .row { display: flex; gap: 6px; margin-top: 7px; }
  .slot button { flex: 1; }

  /* 快捷问题 */
  #quick { flex: none; padding: 0 12px 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  #quick button {
    font-size: 11.5px; padding: 4px 9px; border-radius: 100px;
    border: 1px solid var(--rule); background: var(--card); color: var(--ink2); cursor: pointer;
  }
  #quick button:hover { border-color: var(--acc); color: var(--acc); }

  footer { flex: none; border-top: 1px solid var(--rule); background: var(--card); padding: 9px 12px; }
  .inrow { display: flex; gap: 7px; align-items: flex-end; }
  #q {
    flex: 1; min-height: 38px; max-height: 130px; resize: none; padding: 8px 10px;
    border: 1px solid var(--rule); border-radius: 6px; background: var(--paper);
    color: var(--ink); font: 13px/1.5 inherit;
  }
  #q:focus { outline: none; border-color: var(--acc); }
  button.primary {
    border: 1px solid var(--acc); background: var(--acc); color: #fff;
    padding: 8px 13px; border-radius: 6px; cursor: pointer; font: 500 13px inherit;
  }
  button.ghost {
    border: 1px solid var(--rule); background: var(--card); color: var(--ink2);
    padding: 6px 11px; border-radius: 5px; cursor: pointer; font: 500 12px inherit;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .hint { margin: 6px 0 0; font-size: 10.5px; color: var(--muted); }

  .dots::after {
    content: "▍"; animation: bl 1s steps(2) infinite; color: var(--acc);
  }
  @keyframes bl { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { .dots::after { animation: none } }
</style>
</head>
<body>
  <header>
    <h1>JD Insight</h1>
    <span class="n" id="count">0 条 JD</span>
    <span class="sp"></span>
    <button class="ico" id="newchat" title="新会话">⟳</button>
    <button class="ico" id="settings" title="设置">⚙</button>
  </header>

  <div id="log"></div>

  <div id="quick">
    <button data-q="这批 JD 里最高频的能力要求是什么？按覆盖率排">高频要求</button>
    <button data-q="有几条 JD 要求 Discord 或 Reddit 运营经验？">统计示例</button>
    <button data-q="拿我的简历对比这些 JD，我最该补什么？">简历诊断</button>
    <button data-q="根据这些 JD，面试最可能追问我什么？哪些我答不上来？">面试押题</button>
  </div>

  <footer>
    <div class="inrow">
      <textarea id="q" rows="1" placeholder="问点什么…（Enter 发送 / Shift+Enter 换行）"></textarea>
      <button class="primary" id="send">发送</button>
    </div>
    <p class="hint" id="hint">回答只依据你采集的 JD；JD 里没有的会明确说没有。</p>
  </footer>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
